# Стенд подключается через make acceptance-up, не затрагивая обычный make up.
services:
  overgate:
    environment:
      PROXYF__YGGSTACK: yggstack:1080
      PROXYF__HTTP_PROXY: ""
      LOGGING__LEVEL: debug
    depends_on:
      yggstack:
        condition: service_healthy

  yggstack:
    build:
      context: ./tests/proxyf
      dockerfile: Dockerfile.yggstack
    command: ["-useconffile", "/config/source.json", "-socks", "0.0.0.0:1080"]
    volumes:
      - ./tests/proxyf/source.json:/config/source.json:ro
    networks: [backend]
    depends_on:
      overlay-http:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 --noproxy '' -x socks5h://127.0.0.1:1080 http://[202:15ff:41e0:bde3:b52b:6a47:aac5:9724]/marker | grep -q overlay-marker"]
      interval: 3s
      timeout: 6s
      retries: 30
    cap_drop: [ALL]

  overlay-node:
    build:
      context: ./tests/proxyf
      dockerfile: Dockerfile.yggstack
    command: ["-useconffile", "/config/destination.json", "-remote-tcp", "80:127.0.0.1:8080", "-remote-tcp", "8081:127.0.0.1:8080"]
    volumes:
      - ./tests/proxyf/destination.json:/config/destination.json:ro
    networks: [backend]
    cap_drop: [ALL]

  overlay-http:
    build:
      context: ./tests/proxyf
      dockerfile: Dockerfile.http
    network_mode: service:overlay-node
    depends_on: [overlay-node]
    cap_drop: [ALL]
