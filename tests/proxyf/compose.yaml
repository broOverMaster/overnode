# Самостоятельный стенд; пути разрешаются относительно tests/proxyf.
name: overnode-acceptance
services:
  overgate:
    build:
      context: ../..
      dockerfile: overgate/Dockerfile
    ports:
      - "127.0.0.1:${ACCEPTANCE_PORT:-2080}:2080"
    networks: [backend]
    environment:
      PROXYF__LISTEN_ON: ":2080"
      PROXYF__LOCAL_SITE: oversite:8000
      PROXYF__YGGSTACK: yggstack:1080
      PROXYF__HTTP_PROXY: ""
      LOGGING__LEVEL: debug
    depends_on:
      oversite:
        condition: service_started
      yggstack:
        condition: service_healthy

  oversite:
    build:
      context: ../..
      dockerfile: oversite/Dockerfile
    environment:
      HTTPD__LISTEN_ON: ":8000"
      HTTPD__SITE_PATH: /site
    volumes:
      - ./site:/site:ro
    networks: [backend]

  yggstack:
    build:
      context: .
      dockerfile: Dockerfile.yggstack
    command: ["-useconffile", "/config/source.json", "-socks", "0.0.0.0:1080"]
    volumes:
      - ./source.json:/config/source.json:ro
    networks: [backend]
    depends_on:
      overlay-gate:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 --noproxy '' -x socks5h://127.0.0.1:1080 http://[202:15ff:41e0:bde3:b52b:6a47:aac5:9724]/marker | grep -q overlay-marker"]
      interval: 3s
      timeout: 6s
      retries: 30
    cap_drop: [ALL]

  overlay-node:
    build:
      context: .
      dockerfile: Dockerfile.yggstack
    command: ["-useconffile", "/config/destination.json", "-remote-tcp", "80:127.0.0.1:8080", "-remote-tcp", "8081:127.0.0.1:8080"]
    volumes:
      - ./destination.json:/config/destination.json:ro
    networks: [backend, destination]
    cap_drop: [ALL]

  overlay-gate:
    build:
      context: ../..
      dockerfile: overgate/Dockerfile
    network_mode: service:overlay-node
    environment:
      PROXYF__LISTEN_ON: "127.0.0.1:2080"
      HTTPIN__LISTEN_ON: "127.0.0.1:8080"
      HTTPIN__LOCAL_SITE: overlay-site:8000
      LOGGING__LEVEL: debug
    depends_on: [overlay-node, overlay-site]
    cap_drop: [ALL]

  overlay-site:
    build:
      context: ../..
      dockerfile: oversite/Dockerfile
    environment:
      HTTPD__LISTEN_ON: ":8000"
      HTTPD__SITE_PATH: /site
    volumes:
      - ./site:/site:ro
    networks: [destination]
    cap_drop: [ALL]

networks:
  backend:
  destination:
    internal: true
